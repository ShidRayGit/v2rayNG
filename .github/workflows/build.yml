name: ساخت APK

# بدون لپ‌تاپ: پوش کنید یا از تب Actions دستی اجرا کنید،
# چند دقیقه بعد APK امضاشده در Artifacts آماده است.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: نصب JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: کش Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: نصب NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: ساخت کلید API از secrets
        env:
          API_SECRET: ${{ secrets.NARAN_API_SECRET }}
        run: |
          if [ -z "$API_SECRET" ]; then
            echo "::error::NARAN_API_SECRET تعریف نشده است"
            exit 1
          fi
          python3 tools/gen_secret.py "$API_SECRET" > /tmp/secret.h
          python3 - <<'PY'
          import re, pathlib
          src = pathlib.Path("V2rayNG/app/src/main/jni/naran.c")
          new = pathlib.Path("/tmp/secret.h").read_text()
          body = src.read_text()
          body = re.sub(
              r"static const unsigned char SECRET_BYTES\[\] = \{.*?\};",
              new.split("static const unsigned char", 1)[1].join(
                  ["static const unsigned char", ""]).strip(),
              body, flags=re.S)
          src.write_text(body)
          print("کلید در naran.c نوشته شد")
          PY

      - name: بازسازی کیستور
        env:
          KS_PASS: ${{ secrets.KEYSTORE_ENC_PASS }}
        run: |
          if [ -n "$KS_PASS" ] && [ -f ci/naran.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
              -in ci/naran.jks.enc -out /tmp/naran.jks -k "$KS_PASS"
            if [ -s /tmp/naran.jks ]; then
              echo "کیستور باز شد"
              echo "SIGNED=1" >> $GITHUB_ENV
            else
              echo "::error::رمز کیستور اشتباه است"
              exit 1
            fi
          else
            echo "کیستور نیست — خروجی unsigned خواهد بود"
            echo "SIGNED=0" >> $GITHUB_ENV
          fi

      - name: بیلد
        working-directory: V2rayNG
        env:
          STORE_FILE: /tmp/naran.jks
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: تحویل APK
        uses: actions/upload-artifact@v4
        with:
          name: naran-apk
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: انتشار روی تگ
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: V2rayNG/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
