name: ساخت APK

# v2rayNG بدون دو کتابخانه‌ی بومی بیلد نمی‌شود:
#   libv2ray.aar         از AndroidLibXrayLite با gomobile
#   libhev-socks5-tunnel از hev-socks5-tunnel با NDK
# هر دو اینجا ساخته و کش می‌شوند تا بیلدهای بعدی سریع باشند.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      naran:
        description: 'ماژول ناران را هم بیلد کن'
        type: boolean
        default: true
      xray:
        description: 'نسخه Xray — تگ AndroidLibXrayLite، خالی یعنی همان کامیت زیرماژول'
        type: string
        default: 'v26.6.27'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: نصب JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: نصب NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: انتخاب نسخه Xray
        id: xray
        run: |
          TAG="${{ inputs.xray }}"
          if [ -z "$TAG" ]; then
            TAG="$(cd AndroidLibXrayLite && git describe --tags --always)"
            echo "نسخه‌ی زیرماژول: $TAG"
          else
            cd AndroidLibXrayLite
            git fetch --tags --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null \
              || git fetch --tags origin
            if ! git checkout -q "tags/$TAG"; then
              echo "::error::تگ $TAG پیدا نشد. تگ‌های موجود:"
              git tag --sort=-v:refname | head -12
              exit 1
            fi
            echo "Xray روی $TAG قفل شد"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: نصب Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'AndroidLibXrayLite/go.mod'

      - name: کش hev-socks5-tunnel
        id: cache-hevtun
        uses: actions/cache@v4
        with:
          path: libs
          key: hevtun-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}

      - name: ساخت hev-socks5-tunnel
        if: steps.cache-hevtun.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: کپی کتابخانه‌ی تونل
        run: cp -r libs V2rayNG/app/

      - name: کش libv2ray
        id: cache-xray
        uses: actions/cache@v4
        with:
          path: V2rayNG/app/libs/libv2ray.aar
          key: libv2ray-${{ runner.os }}-${{ steps.xray.outputs.tag }}

      - name: ساخت libv2ray.aar
        if: steps.cache-xray.outputs.cache-hit != 'true'
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          cd AndroidLibXrayLite
          gomobile init
          go mod tidy -v
          gomobile bind -v -androidapi 21 -trimpath \
            -ldflags='-s -w -buildid= -checklinkname=0' ./
          mkdir -p ../V2rayNG/app/libs
          cp *.aar ../V2rayNG/app/libs/libv2ray.aar
          ls -lh ../V2rayNG/app/libs/

      - name: کش Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: ساخت کلید API
        if: github.event_name != 'workflow_dispatch' || inputs.naran
        env:
          API_SECRET: ${{ secrets.NARAN_API_SECRET }}
        run: |
          if [ -z "$API_SECRET" ]; then
            echo "::error::NARAN_API_SECRET تعریف نشده"
            exit 1
          fi
          python3 tools/gen_secret.py "$API_SECRET" | tail -n +2 > /tmp/secret.txt
          python3 - <<'PY'
          import re, pathlib
          src = pathlib.Path("V2rayNG/app/src/main/jni/naran.c")
          block = pathlib.Path("/tmp/secret.txt").read_text().strip()
          body = re.sub(
              r"static const unsigned char SECRET_BYTES\[\] = \{.*?\};",
              block, src.read_text(), flags=re.S)
          src.write_text(body)
          print("کلید در naran.c نوشته شد")
          PY

      - name: کنار گذاشتن ماژول ناران
        if: github.event_name == 'workflow_dispatch' && !inputs.naran
        run: |
          rm -rf V2rayNG/app/src/main/java/com/naran
          echo "ناران کنار گذاشته شد — این یک بیلد پایه است"

      - name: دانلود فایل‌های مسیریابی
        run: |
          ASSETS=V2rayNG/app/src/main/assets
          mkdir -p $ASSETS
          BASE=https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download
          for f in geoip.dat geosite.dat; do
            curl -fsSL -o "$ASSETS/$f" "$BASE/$f" && echo "  $f گرفته شد"
          done
          # هسته این نام را جدا می‌خواهد
          XBASE=https://github.com/v2fly/geoip/releases/latest/download
          curl -fsSL -o "$ASSETS/geoip-only-cn-private.dat" \
            "$XBASE/geoip-only-cn-private.dat" \
            || cp "$ASSETS/geoip.dat" "$ASSETS/geoip-only-cn-private.dat"
          ls -lh $ASSETS

      - name: برندینگ — اسم و آیکون
        run: |
          pip install --quiet Pillow
          python3 tools/set_app_name.py "Naran VPN"
          if ls branding/logo.* >/dev/null 2>&1; then
            python3 tools/make_icons.py
          else
            echo "لوگویی در branding/ نیست — آیکون پیش‌فرض می‌ماند"
          fi

      - name: بازسازی کیستور
        env:
          KS_PASS: ${{ secrets.KEYSTORE_ENC_PASS }}
        run: |
          if [ -n "$KS_PASS" ] && [ -f ci/naran.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
              -in ci/naran.jks.enc -out /tmp/naran.jks -k "$KS_PASS"
            if [ -s /tmp/naran.jks ]; then
              echo "کیستور باز شد"
              echo "SIGNED=1" >> $GITHUB_ENV
            else
              echo "::error::رمز کیستور اشتباه است"
              exit 1
            fi
          else
            echo "کیستور نیست — خروجی unsigned خواهد بود"
            echo "SIGNED=0" >> $GITHUB_ENV
          fi

      - name: تنظیم gradle
        run: |
          if [ "${{ github.event_name != 'workflow_dispatch' || inputs.naran }}" = "true" ]; then
            python3 tools/patch_gradle.py --deps
            python3 tools/patch_manifest.py
          else
            python3 tools/patch_gradle.py
          fi

      - name: بررسی سلامت ماژول
        run: |
          MANIFEST=V2rayNG/app/src/main/AndroidManifest.xml
          SRC=V2rayNG/app/src/main/java/com/naran/core
          if grep -q "com.naran.core.ui.NaranActivity" $MANIFEST; then
            if [ ! -f "$SRC/ui/NaranActivity.kt" ]; then
              echo "::error::منیفست NaranActivity را صدا می‌زند ولی فایلش نیست"
              exit 1
            fi
            COUNT=$(find $SRC -name "*.kt" | wc -l)
            echo "ماژول ناران: $COUNT فایل"
            [ "$COUNT" -ge 10 ] || { echo "::error::فایل‌های ناران ناقص‌اند"; exit 1; }
          else
            echo "بیلد پایه — بدون ناران"
          fi

      - name: بیلد
        working-directory: V2rayNG
        env:
          STORE_FILE: /tmp/naran.jks
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assemblePlaystoreDebug --no-daemon --stacktrace
          echo "── ساخته شد با Xray ${{ steps.xray.outputs.tag }} ──"

      - name: تحویل APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naran-apk-${{ steps.xray.outputs.tag }}
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          compression-level: 0
          if-no-files-found: warn
          retention-days: 30
